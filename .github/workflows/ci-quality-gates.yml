# SpecPilot CI quality gates (w00-s04)
#
# Semantics (binding):
# - This workflow is independent POST-PUSH remote verification on `main`.
# - It does NOT pre-block commits from entering `main` (main-only / no-PR policy).
# - Mandatory prevention is the local `scripts/run-quality-gates.sh` PASS before commit/push.
# - On remote failure: fail closed, visible, immediate correction on `main`.
# - Does NOT use Docker Compose as the CI vehicle.

name: ci-quality-gates

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run quality gates
        run: bash scripts/run-quality-gates.sh
